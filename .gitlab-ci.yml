image: registry.cern.ch/docker.io/ubuntu:jammy

stages:
  - build

precommit_mr:
  stage: build
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -y && apt-get upgrade -y
    - apt-get install -y git python3 python3-pip
    - python3 -m pip install --no-cache-dir pre-commit
  script:
    - |
      TARGET_BRANCH="${CI_DEFAULT_BRANCH:-master}"
      git fetch origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
      CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "origin/${TARGET_BRANCH}...${CI_COMMIT_SHA}")
    - |
      if [ -z "$CHANGED_FILES" ]; then
        echo "No changed files in merge request diff."
        exit 0
      fi
    - |
      if pre-commit run --show-diff-on-failure --color=always --files $CHANGED_FILES ; then
        echo "Pre-commit checks passed."
        exit 0
      fi
    - |
      git config --global user.email "noreply@gitlab.cern.ch"
      git config --global user.name "Gitlab CI"
      if [ -n "$(git status --porcelain)" ] ; then
        # Local changes are present: upload as a patch
        git commit -a --author "$CI_COMMIT_AUTHOR" -m "Apply pre-commit fixes"
        PATCH_ARGS="--files $CHANGED_FILES --fixes-patch precommit-fixes.patch"
      else
        git commit --allow-empty -m "No autofix available"
        PATCH_ARGS=""
      fi
    - git format-patch -1 --stdout > precommit-fixes.patch
    - python3 scripts/process-precommit-mr.py $PATCH_ARGS
    - exit 1
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - precommit-fixes.patch

# performing the static analysis code check using a custom docker image with the llvm installation we need
code_checks:
  stage: build
  before_script:
    - apt update -y && apt-get upgrade -y
    - apt install -y software-properties-common wget clang-14 libclang-14-dev clang-tidy-14 python3 python-is-python3 cmake git
  script:
    - mkdir build && cd build
    - CXX=clang++-14 cmake .. -DVECGEOM_BUILTIN_VECCORE=ON -DVECGEOM_ROOT=OFF -DVECGEOM_GDML=OFF -DVECGEOM_TEST_STATIC_ANALYSIS=ON -DVECGEOM_BACKEND=Scalar
    - make -j8
    - ctest -j8 -V

# normal build against a recent ROOT; using the ALICE software stack
# Solid model with navigation index
NOSURF_NAVINDEX_ROOT:
   tags:
     - cvmfs
   image: cern/alma9-base
   stage: build
   before_script:
     - yum install -y environment-modules libX11 cmake
     - yum install -y unzip autoconf automake make gcc git harfbuzz-icu
     - eval $(/cvmfs/alice.cern.ch/bin/alienv printenv ROOT::v6-28-02-1)
     - export VC_PATH=/cvmfs/alice.cern.ch/el9-x86_64/Packages/Vc/1.4.1-13
     - export CMAKE_PREFIX_PATH=${VC_PATH}:${CMAKE_PREFIX_PATH}
   script:
     - mkdir build && cd build
     - cmake .. -DVECGEOM_BUILTIN_VECCORE=ON -DVECGEOM_BACKEND=Vc -DVECGEOM_USE_SURF=OFF -DVECGEOM_NAV="index" -DVECGEOM_ROOT=ON -DVECGEOM_GDML=OFF
       # for the moment exclude the E03 test since downloading E03 root geometry has problems on the CI machine
     - make -j8 VERBOSE=ON && ctest --output-on-failure -j8 -E E03

